[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-automation"
version = "0.1.0"
description = "Offline-first YouTube interview-preparation video automation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
  "chatterbox-tts>=0.1.4",
  "cryptography>=42.0",
  "huggingface-hub>=0.24",
  "jsonschema>=4.21",
  "requests>=2.31",
  "torchaudio>=2.2",
  "transformers>=4.45",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
interview-auto = "interview_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
